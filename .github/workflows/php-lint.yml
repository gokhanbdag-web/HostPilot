name: PHP syntax checks
on: [push, pull_request, workflow_dispatch]
jobs:
  lint:
    name: PHP syntax checks (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Lint PHP source
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
          php tests/mfa_totp.php
          php tests/payment_crypto.php
          php tests/hosting_adapters.php
          php tests/provisioning_queue.php
          php tests/billing_lifecycle.php
          php tests/package_changes.php
