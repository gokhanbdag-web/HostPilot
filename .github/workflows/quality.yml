name: HostPilot quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostpilot-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-and-deployment-safety:
    name: PHP syntax and deployment safety
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, pdo, pdo_mysql
          coverage: none

      - name: Verify PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' files < <(git ls-files -z -- '*.php')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No tracked PHP files were found."
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Test SQL migration parser
        run: php tests/migration_runner.php

      - name: Prevent Composer dependency
        shell: bash
        run: |
          if [ -f composer.json ] || [ -f composer.lock ]; then
            echo "HostPilot must remain installable without Composer."
            exit 1
          fi

      - name: Prevent runtime secrets in Git
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-files | grep -E '(^|/)(\.env|storage/config\.php|storage/installed\.lock)$'; then
            echo "A private environment or installation file is tracked by Git."
            exit 1
          fi
          echo "No tracked runtime configuration or installation lock found."


  live-health-check:
    name: Live deployment health check
    runs-on: ubuntu-latest
    needs: php-and-deployment-safety
    timeout-minutes: 5
    steps:
      - name: Wait for webhook deployment and verify live application
        shell: bash
        run: |
          set -Eeuo pipefail
          url="https://kodvadisi.com.tr/hostpilot/health"
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --output /tmp/hostpilot-health.json --write-out '%{http_code}' --max-time 10 "$url" || true)"
            if [ "$code" = "200" ] && grep -q '"status":"healthy"' /tmp/hostpilot-health.json; then
              cat /tmp/hostpilot-health.json
              echo "Live health check passed."
              exit 0
            fi
            echo "Waiting for deployment health: attempt $attempt/24 (HTTP $code)"
            sleep 10
          done
          echo "Live health check failed. Latest response:"
          cat /tmp/hostpilot-health.json || true
          exit 1
