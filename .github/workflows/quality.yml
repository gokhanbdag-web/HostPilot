name: HostPilot quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hostpilot-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  php-and-deployment-safety:
    name: PHP syntax and deployment safety (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, openssl, pdo, pdo_mysql
          coverage: none
      - name: Verify PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' files < <(git ls-files -z -- '*.php')
          if [ "${#files[@]}" -eq 0 ]; then echo "No tracked PHP files were found."; exit 1; fi
          for file in "${files[@]}"; do php -l "$file"; done
      - name: Test SQL migration parser
        run: php tests/migration_runner.php
      - name: Test database backup restore policy
        run: php tests/database_backup_restore_policy.php
      - name: Test demo data opt-in policy
        run: php tests/demo_seeder_opt_in.php
      - name: Test payment idempotency policy
        run: php tests/payment_idempotency_policy.php
      - name: Test payment gateway protocol contracts
        run: php tests/payment_gateway_contracts.php
      - name: Test PayTR initialization request contract
        run: php tests/paytr_initialization_contract.php
      - name: Test iyzico retrieve response verification policy
        run: php tests/iyzico_retrieve_verification.php
      - name: Test manual payment reconciliation policy
        run: php tests/payment_reconciliation_policy.php
      - name: Test hosting transport SSRF policy
        run: php tests/hosting_transport_ssrf.php
      - name: Test cron header authentication policy
        run: php tests/cron_auth_policy.php
      - name: Test authentication session policy
        run: php tests/auth_session_security.php
      - name: Test login rate limiting
        run: php tests/auth_rate_limit.php
      - name: Test security audit event policy
        run: php tests/security_audit.php
      - name: Test operational audit coverage
        run: php tests/operational_audit_coverage.php
      - name: Test centralized admin authorization
        run: php tests/authorization.php
      - name: Test staff permission catalog
        run: php tests/staff_permission_catalog.php
      - name: Test customer privacy policy
        run: php tests/privacy_policy.php
      - name: Test IDOR access boundaries
        run: php tests/idor_access.php
      - name: Test HTML output escaping
        run: php tests/security_output.php
      - name: Test ticket attachment policy
        run: php tests/ticket_attachments.php
      - name: Test ClamAV scanner policy
        run: php tests/clamav_scanner.php
      - name: Prevent Composer dependency
        run: |
          if [ -f composer.json ] || [ -f composer.lock ]; then echo "HostPilot must remain installable without Composer."; exit 1; fi
      - name: Prevent runtime secrets in Git
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-files | grep -E '(^|/)(\.env|storage/config\.php|storage/installed\.lock)$'; then echo "A private environment or installation file is tracked by Git."; exit 1; fi
          echo "No tracked runtime configuration or installation lock found."

  migration-runner-tests:
    name: SQL migration integration (${{ matrix.database }}, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql-8.0
            image: mysql:8.0
            php-version: '8.2'
          - database: mysql-8.0
            image: mysql:8.0
            php-version: '8.3'
          - database: mariadb-10.11
            image: mariadb:10.11
            php-version: '8.2'
          - database: mariadb-10.11
            image: mariadb:10.11
            php-version: '8.3'
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hostpilot_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, pdo, pdo_mysql
          coverage: none
      - name: Lint and run parser tests
        run: |
          php -l app/Core/MigrationRunner.php
          php -l tests/migration_runner.php
          php tests/migration_runner.php
      - name: Run SQL against disposable database
        env:
          HOSTPILOT_DB_HOST: 127.0.0.1
          HOSTPILOT_DB_PORT: 3306
          HOSTPILOT_DB_NAME: hostpilot_ci
          HOSTPILOT_DB_USER: root
          HOSTPILOT_DB_PASSWORD: root
        run: |
          php -l tests/migration_integration.php
          php tests/migration_integration.php
      - name: Run authenticated HTTP security integration tests
        env:
          HOSTPILOT_DB_HOST: 127.0.0.1
          HOSTPILOT_DB_PORT: 3306
          HOSTPILOT_DB_NAME: hostpilot_ci
          HOSTPILOT_DB_USER: root
          HOSTPILOT_DB_PASSWORD: root
        run: |
          php -l tests/http_security_integration.php
          php tests/http_security_integration.php
      - name: Smoke-test browser installer on disposable database
        env:
          HOSTPILOT_DB_HOST: 127.0.0.1
          HOSTPILOT_DB_PORT: 3306
          HOSTPILOT_DB_USER: root
          HOSTPILOT_DB_PASSWORD: root
          HOSTPILOT_INSTALL_DB_NAME: hostpilot_installer_ci
        run: |
          php -l tests/installer_http_smoke.php
          php -S 127.0.0.1:8080 -t . > /tmp/hostpilot-installer-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 1
          done
          php tests/installer_http_smoke.php

  live-health-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Live deployment health check
    runs-on: ubuntu-latest
    needs: php-and-deployment-safety
    timeout-minutes: 5
    steps:
      - name: Wait for webhook deployment and verify live application
        shell: bash
        run: |
          set -Eeuo pipefail
          url="https://kodvadisi.com.tr/hostpilot/health"
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --output /tmp/hostpilot-health.json --write-out '%{http_code}' --max-time 10 "$url" || true)"
            if [ "$code" = "200" ] && grep -q '"status":"healthy"' /tmp/hostpilot-health.json; then cat /tmp/hostpilot-health.json; echo "Live health check passed."; exit 0; fi
            echo "Waiting for deployment health: attempt $attempt/24 (HTTP $code)"
            sleep 10
          done
          echo "Live health check failed. Latest response:"
          cat /tmp/hostpilot-health.json || true
          exit 1
